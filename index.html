<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PK142864 Emulator</title>
</head>
<body>

<h1>PK142864 Emulator</h1>

<p>Select system and ROM:</p>

<select id="system">
  <option value="nes">NES</option>
  <option value="snes">SNES</option>
  <option value="gb">Game Boy</option>
  <option value="gbc">Game Boy Color</option>
  <option value="gba">Game Boy Advance</option>
  <option value="n64">Nintendo 64</option>
  <option value="psx">PlayStation 1</option>
</select>

<select id="rom">
  <option value="roms/example.nes">Example NES</option>
  <option value="roms/example.smc">Example SNES</option>
  <option value="roms/example.gb">Example GB</option>
  <option value="roms/example.gbc">Example GBC</option>
  <option value="roms/example.gba">Example GBA</option>
  <option value="roms/example.n64">Example N64</option>
  <option value="roms/example.bin">Example PSX</option>
</select>

<button id="startBtn">Start</button>

<div id="game"></div>

<script>
  // EmulatorJS required globals
  window.EJS_player = "#game";
  window.EJS_core = "nes";
  window.EJS_gameUrl = "";
  window.EJS_pathtodata = "data/";
  window.EJS_biosUrl = "";
</script>

<script src="data/emulator.js"></script>

<script>
  const systemSelect = document.getElementById("system");
  const romSelect = document.getElementById("rom");
  const startBtn = document.getElementById("startBtn");

  startBtn.onclick = () => {
    const system = systemSelect.value;
    const romPath = romSelect.value;

    const coreMap = {
      nes: "nes",
      snes: "snes",
      gb: "gb",
      gbc: "gbc",
      gba: "gba",
      n64: "n64",
      psx: "psx"
    };

    window.EJS_core = coreMap[system];
    window.EJS_gameUrl = romPath;

    if (system === "psx") {
      window.EJS_biosUrl = "bios/scph1001.bin";
    } else {
      window.EJS_biosUrl = "";
    }

    if (window.EJS_reload) {
      window.EJS_reload();
    } else {
      const qs = `?system=${system}&rom=${romPath}`;
      window.location.search = qs;
    }
  };
</script>

</body>
</html>
