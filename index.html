<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SnappyShortPie Emulator</title>

  <style>
    body {
      background:#111;
      color:#eee;
      font-family:sans-serif;
      text-align:center;
      margin:0;
      padding:20px;
    }
    #screen {
      background:#000;
      border:2px solid #444;
      margin-top:20px;
    }
    #controls {
      margin-top:20px;
    }
    select, button, input[type="file"] {
      padding:8px 12px;
      margin:5px;
      background:#222;
      color:#eee;
      border:1px solid #555;
      cursor:pointer;
    }
    #dropzone {
      margin:20px auto;
      width:300px;
      padding:20px;
      border:2px dashed #555;
      color:#aaa;
    }
  </style>
</head>
<body>

<h1>SnappyShortPie Emulator</h1>

<div id="controls">
  <select id="coreSelect">
    <option value="nes">NES</option>
    <option value="gb">Game Boy</option>
    <option value="gba">Game Boy Advance</option>
    <option value="snes">SNES</option>
  </select>

  <input type="file" id="romInput" accept=".nes,.gb,.gba,.smc,.sfc">
  <button id="fullscreenBtn">Fullscreen</button>
</div>

<div id="dropzone">Drop ROM here</div>

<canvas id="screen" width="256" height="240"></canvas>

<script type="module">
  import { NES } from "./emu/cores/nes.js";
  import { GB } from "./emu/cores/gb.js";
  import { GBA } from "./emu/cores/gba.js";
  import { SNES } from "./emu/cores/snes.js";

  const canvas = document.getElementById("screen");
  const coreSelect = document.getElementById("coreSelect");
  const romInput = document.getElementById("romInput");
  const dropzone = document.getElementById("dropzone");
  const fullscreenBtn = document.getElementById("fullscreenBtn");

  let core = null;

  function loadCore(type) {
    switch(type) {
      case "nes": return new NES({ canvas, audio:true, fps:60 });
      case "gb":  return new GB({  canvas, audio:true, fps:60 });
      case "gba": return new GBA({ canvas, audio:true, fps:60 });
      case "snes":return new SNES({canvas, audio:true, fps:60 });
    }
  }

  function startROM(buffer) {
    core = loadCore(coreSelect.value);
    core.loadROM(new Uint8Array(buffer));
    core.start();
  }

  romInput.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    startROM(buf);
  };

  dropzone.ondragover = e => {
    e.preventDefault();
    dropzone.style.borderColor = "#aaa";
  };

  dropzone.ondragleave = () => {
    dropzone.style.borderColor = "#555";
  };

  dropzone.ondrop = async e => {
    e.preventDefault();
    dropzone.style.borderColor = "#555";

    const file = e.dataTransfer.files[0];
    if (!file) return;

    const buf = await file.arrayBuffer();
    startROM(buf);
  };

  fullscreenBtn.onclick = () => {
    canvas.requestFullscreen();
  };
</script>

</body>
</html>
